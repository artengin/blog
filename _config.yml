title: "Артём Осепян - Блог 📝"
description: "Бэкенд-разработчик. Делюсь мыслями о подходах, инструментах, ошибках и выводах из рабочей практики."
url: "https://artengin.github.io"
baseurl: "/blog"
lang: ru
timezone: Europe/Moscow
remote_theme: "jekyll/minima@4de3223"
minima:
  skin: classic
  social_links:
    - title: GitHub
      icon: github
      url: "https://github.com/artengin"
    - title: Telegram
      icon: telegram
      url: "https://t.me/artengin_notes"
    - title: Портфолио
      icon: terminal
      style: solid
      url: "https://artengin.github.io"
plugins:
  - jekyll-feed
  - jekyll-remote-theme
defaults:
  - scope:
      type: posts
    values:
      layout: post
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
